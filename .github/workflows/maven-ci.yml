name: Maven CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: "📥 Checkout Repository"
      uses: actions/checkout@v3

    - name: "☕ Set up Java"
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: "📦 Build with Maven"
      run: mvn clean install -DskipTests=false
